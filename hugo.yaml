baseURL: "https://888xiyan.github.io/MyBlog-888xiyan/"
locale: zh-cn
defaultContentLanguage: zh-cn
title: "YHY · 知识生长记"
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "关于工程、智能体、系统设计与持续学习的个人知识花园。"
  author: "YHY"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  homeInfoParams:
    Title: "向外认知，向内生长。"
    Content: "记录工程实践、智能体探索与系统化学习。"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
