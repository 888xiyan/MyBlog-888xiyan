baseURL: "https://888xiyan.github.io/MyBlog-888xiyan/"
locale: zh-cn
defaultContentLanguage: zh-cn
title: "888xiyan 的博客"
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "技术、思考与记录"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  homeInfoParams:
    Title: "你好，欢迎来到我的博客 👋"
    Content: "这里记录技术学习、项目实践与日常思考。"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
