{{ define "main" }}
  <section class="archive section" aria-labelledby="archive-title">
    <p class="eyebrow"><span></span> ARCHIVE</p>
    <h1 id="archive-title">{{ .Title }}</h1>
    <div class="archive-list">
      {{ range .Pages.ByDate.Reverse }}
        <article class="archive-item">
          <p>{{ .Date.Format "2006.01.02" }}</p>
          <div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Summary }}</p></div>
          <a href="{{ .RelPermalink }}" aria-label="阅读 {{ .Title }}">↗</a>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
