<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ .Site.Home.RelPermalink }}" aria-label="返回首页">
          <span class="wordmark-mark">Y</span>
          <span>YHY<span class="wordmark-muted">.notes</span></span>
        </a>
        <nav aria-label="主导航">
          <a href="{{ "posts/" | relURL }}">文章</a>
          <a href="{{ "bookmarks/" | relURL }}">收藏</a>
          <a href="{{ "#topics" | relURL }}">主题</a>
          <a href="{{ "#about" | relURL }}">关于</a>
        </nav>
      </header>
      <main>
        {{ block "main" . }}{{ end }}
      </main>
      <footer class="site-footer">
        <p>建立自己的坐标系，记录仍在发生的学习。</p>
        <p><a href="mailto:sabersaber0610@qq.com">sabersaber0610@qq.com</a> · © {{ now.Year }} YHY · 使用 <a href="https://gohugo.io/" rel="noopener">Hugo</a> 构建</p>
      </footer>
    </div>
  </body>
</html>
